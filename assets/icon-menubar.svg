       mark in senti.lua traces the same curve. -->
  <path d="M 28.29 11.93 A 7.0 7.0 0 1 0 22 22 A 7.0 7.0 0 1 1 15.71 32.07"
        fill="none" stroke="#000000" stroke-width="5.6" stroke-linecap="round"/>
</svg>
