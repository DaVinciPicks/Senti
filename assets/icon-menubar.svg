<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">
  <!-- Menu-bar template image. macOS discards the colour and uses ONLY the alpha
       channel as a silhouette, then tints it for light/dark/active automatically,
       so this is deliberately solid black on transparent, no background tile.
       Drawn at 44px (22pt @2x). The S is the same path as the HUD mark in
       senti.lua and the small app icon. -->
  <path d="M 29.5 15.5 C 29.5 8.5, 14.5 8.5, 14.5 16.5 C 14.5 24.5, 29.5 19.5, 29.5 27.5 C 29.5 35.5, 14.5 35.5, 14.5 28.5"
        fill="none" stroke="#000000" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
