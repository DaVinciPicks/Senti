<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="44" height="44" viewBox="0 0 44 44">
  <!-- Menu-bar template. macOS discards RGB and uses the alpha channel as a
       silhouette, tinting it for light/dark/active. The mark's negative space is
       genuinely transparent in the master, so the swirl survives as a shape
       rather than collapsing into a blob. Inset to ~18pt of optical weight. -->
  <image x="3" y="3" width="38" height="38"
         xlink:href="logo-mark.png" preserveAspectRatio="xMidYMid meet"/>
</svg>
