<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">
  <!-- Menu-bar template image. macOS discards the colour and uses ONLY the alpha
       channel as a silhouette, then tints it for light/dark/active automatically —
       so this is deliberately solid black on transparent, no background tile.
       Drawn at 44px (22pt @2x); the glyph targets ~16pt of optical weight to sit
       correctly next to system menu-bar items. -->
  <g fill="#000000">
    <rect x="16.5" y="7" width="11" height="19" rx="5.5"/>
    <rect x="20.7" y="32" width="2.6" height="5" rx="1.3"/>
    <rect x="15.5" y="35.6" width="13" height="2.6" rx="1.3"/>
  </g>
  <path d="M 11.5 22.5 A 10.5 10.5 0 0 0 32.5 22.5"
        fill="none" stroke="#000000" stroke-width="2.6" stroke-linecap="round"/>
</svg>
