<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SMALL-SIZE VARIANT (16-64px). Same tile, larger mark: at 16px the swirl's
       negative space is the first thing to mud out, so it gets more of the tile
       than the Apple grid would strictly allow. This is why icon sets are tuned
       per size rather than downsampled from one master. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#0E0E12"/>
  <image x="196" y="196" width="632" height="632"
         xlink:href="logo-mark.png" preserveAspectRatio="xMidYMid meet"/>
</svg>
