  <!-- Senti app icon: a bold S with a waveform rising from its top bowl and
       falling from its bottom bowl, on a blue tile.
       Construction: the S is two circles of the same radius stacked on one axis,
       drawn as a single stroked path. The top waveform is seven round-topped bars
       under a centre-weighted envelope; the bottom one is the same group rotated
       180 degrees, so the mark has point symmetry. Used for 128px and up. -->
<rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
<rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
<rect x="103" y="103" width="818" height="818" rx="183" fill="none" stroke="url(#rim)" stroke-width="6"/>
