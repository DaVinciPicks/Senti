<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Senti app icon: the S with a waveform, on the brand blue.
       The artwork is assets/logo-wave.png, clipped to its own circle so the
       corners are transparent, then scaled to the standard macOS proportion
       (about 824px of art on a 1024 canvas). Used for 128px and up; below that
       the waveform turns to noise, so icon-small.svg carries a plain S. -->
  <defs>
    <clipPath id="disc"><circle cx="511" cy="507" r="458"/></clipPath>
  </defs>
  <g transform="translate(512 512) scale(0.9) translate(-511 -507)">
    <image xlink:href="logo-wave.png" href="logo-wave.png" width="1024" height="1024" clip-path="url(#disc)"/>
  </g>
</svg>
