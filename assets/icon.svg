<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Sanele app icon: the blue mark on a near-black tile.
       The tile is the same #0E0E12 as the HUD pill, so icon, overlay and toast
       read as one product.
       Geometry follows Apple's grid: an 824px rounded square inside 1024, corner
       radius 185 (about 22.4%, macOS's squircle proportion). A bare transparent
       mark reads as unfinished in the Dock beside tiled system icons.
       The mark is a raster master (logo-mark.png, 2000px). The supplied "SVG"
       was a base64 bitmap wrapped in filter and mask elements, 261KB carrying no
       paths, so nothing was gained by keeping it. resvg resolves the relative
       href via its resources-dir flag (set in app/make-icon.sh).
       NB: XML comments may not contain a double hyphen; writing the flag with
       its leading dashes here makes resvg fail to parse the whole file. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#0E0E12"/>
  <image x="232" y="232" width="560" height="560"
         xlink:href="logo-mark.png" preserveAspectRatio="xMidYMid meet"/>
</svg>
