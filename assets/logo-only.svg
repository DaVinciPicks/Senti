<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Bare mark, no tile. Used by the HUD pill and the toast card, which supply
       their own dark background; a second tile inside them would read as a
       sticker pasted onto the overlay. -->
  <image x="16" y="16" width="992" height="992"
         xlink:href="logo-mark.png" preserveAspectRatio="xMidYMid meet"/>
</svg>
